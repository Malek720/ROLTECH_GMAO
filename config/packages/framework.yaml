# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Base URL used when generating absolute URLs outside a web request (CLI
    # commands) and by the machine fiche QR code. The real value is set in
    # .env.local; the documented default is http://127.0.0.1:8000.
    router:
        default_uri: '%env(DEFAULT_URI)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
